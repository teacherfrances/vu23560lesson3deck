<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesson 3: Writing to a business</title>
<style>
:root{
  --black:#141414; --bar:#1d1d1d; --addr:#3b3b3b;
  --mid:#555; --grey:#7a7a7a; --line:#9a9a9a; --pale:#ececec; --pale2:#f5f5f5;
  --or:#F5A20F; --or-tint:#FFF0D2; --or-deep:#8A5300; --red:#9b2c2c;
  --disp:"Century Gothic","CenturyGothic","URW Gothic","URW Gothic L","AppleGothic","Avant Garde","Futura","Trebuchet MS",sans-serif;
  --body:Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono","Courier New",monospace;
}
body{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.p1{--pc:#F5A20F;--pc-ink:#141414;--pc-tint:#FFF0D2}
body.p2{--pc:#B35400;--pc-ink:#ffffff;--pc-tint:#F7E1CC}
body.p3{--pc:#6B6B6B;--pc-ink:#ffffff;--pc-tint:#EBEBEB}
body.p4{--pc:#141414;--pc-ink:#F5A20F;--pc-tint:#F3F3F3}
*{box-sizing:border-box}
html{font-size:24px;height:100%}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--body);color:var(--black);background:#fff;line-height:1.3;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--or);outline-offset:3px;box-shadow:0 0 0 7px var(--black)}
.disp{font-family:var(--disp);font-weight:700}

/* top bar: a browser window */
.top{background:var(--bar);color:#fff;display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;flex:none}
.dots{display:flex;gap:.22rem;flex:none}
.dots i{display:block;width:.42rem;height:.42rem;border-radius:50%;background:#9a9a9a}
.dots i:first-child{background:var(--or)}
.addr{flex:1;min-width:0;background:var(--addr);border-radius:999px;padding:.25rem .8rem;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:#fff;color:#111;border:0;border-radius:4px;font-weight:700;font-size:.8rem;min-height:1.9rem;min-width:1.9rem;padding:0 .5rem;flex:none}
.tag{background:var(--or);color:#111;font-family:var(--disp);font-weight:700;font-size:.8rem;padding:.1rem .45rem;flex:none}
.prog{height:.5rem;background:#fff;flex:none;display:flex;gap:2px;padding:2px 2px 0}
.prog i{display:block;flex:1;height:100%;opacity:.28}
.prog i.past{opacity:1}
.prog i.cur{opacity:1;box-shadow:inset 0 -3px 0 #fff}
.ppill{flex:none;font-family:var(--disp);font-weight:700;font-size:.75rem;padding:.15rem .6rem;border:2px solid #fff;border-radius:999px;background:var(--pc);color:var(--pc-ink);white-space:nowrap}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:.6rem .9rem}
.wrap{max-width:1250px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.slide{font-size:1em}

/* bottom bar */
.foot{flex:none;border-top:6px solid var(--pc);background:#fff;padding:.35rem .6rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.foot .tip{flex:1 1 0;color:var(--mid);font-size:.8rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot .btns{display:flex;gap:.4rem;margin-left:auto}
.bb{border:3px solid var(--black);background:#fff;font-weight:700;min-height:2.1em;padding:0 .8em;border-radius:3px}
.foot .bb{min-height:2.1rem;padding:0 .8rem}
.bb.solid{background:var(--black);color:#fff}
.bb.go{background:var(--or);color:var(--black)}
.bb[disabled]{opacity:.35;cursor:default}

/* ===== slide content, all in em so the fit can shrink it ===== */
.sbar{display:flex;align-items:stretch;margin:0 0 .7em}
.sbar .blk{background:var(--pc);color:var(--pc-ink);font-family:var(--disp);font-weight:700;min-width:2.3em;display:flex;align-items:center;justify-content:center;font-size:1.05em;padding:0 .3em}
.sbar .ttl{flex:1;background:var(--pc-tint);border:3px solid var(--black);border-left:0;padding:.3em .8em;font-family:var(--disp);font-weight:700;font-size:1.05em}
.lede{color:var(--mid);font-style:italic;margin:.2em 0 .6em}
.card{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;padding:.8em 1em;margin:.6em 0}
.act{display:flex;align-items:stretch;margin:.4em 0 .6em}
.act .num{background:var(--pc);color:var(--pc-ink);font-weight:700;min-width:2em;display:flex;align-items:center;justify-content:center}
.act .ins{flex:1;border:3px solid var(--black);border-left:0;padding:.3em .7em;font-weight:700}
.note{display:flex;background:var(--pale2);margin:.6em 0}
.note .badge{width:2.1em;flex:none;background:#555;color:#fff;display:flex;justify-content:center;padding-top:.4em;font-weight:700;font-size:1.05em}
.note.ok .badge{background:var(--black);color:var(--or)}
.note.warn .badge{background:var(--red)}
.note .nb{padding:.5em .9em;flex:1;min-width:0}
.note p{margin:.15em 0}
.hl{background:var(--or-tint);border-bottom:3px solid var(--or);padding:0 .2em;font-weight:700}
.muted{color:var(--mid)}
.small{font-size:.8em}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.wc{border:2px solid var(--black);background:#fff;padding:.15em .7em;min-height:1.9em;border-radius:999px}
.big{font-family:var(--disp);font-weight:700;font-size:2.4em;line-height:1.05;margin:.2em 0}
.qtext{font-family:var(--disp);font-weight:700;font-size:1.35em;line-height:1.2;margin:.3em 0 .6em}

/* hero */
.bw{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;overflow:hidden}
.bwbar{background:var(--bar);color:#fff;display:flex;align-items:center;gap:.5em;padding:.4em .6em}
.bwaddr{flex:1;min-width:0;font-size:.9em;white-space:nowrap;overflow:hidden}
.bw .tag{font-size:.8em}
.caret{display:inline-block;width:.12em;height:1em;background:var(--or);vertical-align:-.12em;margin-left:.05em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.panel{background:var(--pc-tint);border-left:14px solid var(--pc);padding:1em 1.2em;margin:1em}
.eyebrow{font-family:var(--disp);font-weight:700;font-size:.85em}
.sub{font-size:1.1em}
.load{margin:0 1em .8em;border:3px solid var(--black);height:1.1em;background:#fff;position:relative}
.load .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(45deg,#141414 0 12px,var(--or) 12px 24px)}
.loadtxt{margin:0 1em 1em;font-weight:700}

/* agenda */
.agenda{display:flex;flex-direction:column;gap:.5em}
.ag{display:flex;align-items:center;gap:.7em;border:3px solid var(--black);border-bottom:8px solid var(--pc);padding:.5em .8em;font-size:1.2em;font-weight:700;background:#fff}
.ag .em{font-size:1.4em}
.ag .n{background:var(--pc);color:var(--pc-ink);font-family:var(--disp);min-width:1.6em;text-align:center;padding:.1em 0}

/* option buttons */
.opt{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;border:3px solid var(--black);background:#fff;min-height:2.2em;padding:.35em .8em;margin:.4em 0;border-radius:3px}
.opt .mk{margin-left:auto;font-weight:700;flex:none}
.opt.right{background:var(--black);color:#fff}
.opt.right .mk{color:var(--or);font-size:1.2em}
.opt.wrong{background:repeating-linear-gradient(45deg,#e8e8e8 0 8px,#cdcdcd 8px 16px)}
.opt.wrong .tx{text-decoration:line-through}
.opt.dim{opacity:.5}
.opt.phrase{font-size:1.15em}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(15em,100%),1fr));gap:.5em}
.chip{display:flex;align-items:stretch;border:3px solid var(--black);background:#fff;text-align:left;min-height:2.3em;padding:0;width:100%}
.chip .l{background:var(--black);color:var(--or);font-family:var(--disp);font-weight:700;width:2.1em;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.05em}
.chip .t{padding:.3em .6em;flex:1;min-width:0}
.chip .t b{display:block}
.chip .d{display:block;margin-top:.25em;color:var(--mid)}
.chip.on{border-bottom:8px solid var(--or);background:var(--or-tint)}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:.3em;border-bottom:4px solid var(--black)}
.tabbtn{border:3px solid var(--black);border-bottom:0;background:var(--pale);padding:.3em .8em;font-weight:700;min-height:2.1em;text-align:left;border-radius:6px 6px 0 0}
.tabbtn.on{background:var(--black);color:#fff;box-shadow:inset 0 6px 0 var(--or)}
.tabbody{border:3px solid var(--black);border-top:0;border-bottom:10px solid var(--pc);padding:.7em 1em;background:#fff}
.tabbody p{margin:.3em 0}

/* poll */
.poll{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(9em,100%),1fr));gap:.5em}
.pt{border:3px solid var(--black);border-bottom-width:7px;background:#fff;padding:.5em;display:flex;flex-direction:column;align-items:center;gap:.15em;min-height:4.2em;position:relative}
.pt .em{font-size:1.6em;line-height:1.1}
.pt .cnt{position:absolute;top:.2em;right:.3em;background:var(--or);color:var(--black);border:2px solid var(--black);font-family:var(--mono);font-weight:700;min-width:1.3em;padding:0 .25em;font-size:.9em}
.pt .meter{width:100%;height:.4em;background:var(--pale);margin-top:.2em}
.pt .meter i{display:block;height:100%;background:var(--or)}
.ptools{margin-top:.6em}

/* board */
.legend{display:flex;flex-wrap:wrap;gap:.8em;margin:.2em 0 .5em}
.legend span{display:inline-flex;align-items:center;gap:.35em}
.sw{display:inline-block;width:1.1em;height:1.1em;border:3px solid var(--black)}
.sw.q{background:var(--pc)}
.sw.d{background:var(--or-tint)}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.5em}
.tile{aspect-ratio:1.25/1;border:3px solid var(--black);border-bottom-width:8px;background:#fff;font-family:var(--disp);font-weight:700;font-size:1.4em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;padding:0}
.tile .ic{font-size:.6em;font-family:var(--body)}
.tile.quiz{background:var(--pc);color:var(--pc-ink)}
.tile.done{background:var(--or-tint);color:var(--black);border-bottom-color:var(--or)}
.tile.done .ic::after{content:" \2713";font-weight:700}
.qhead{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.ntile{background:var(--pc);color:var(--pc-ink);font-weight:700;min-width:2em;min-height:2em;display:flex;align-items:center;justify-content:center}
.ntile.talk{background:#fff;color:var(--black);border:3px solid var(--black)}
.kick{border:2px solid var(--black);padding:.05em .5em;font-weight:700}
.show{border:3px solid var(--black);background:var(--pale2);padding:.5em .8em;margin:.4em 0;font-family:var(--mono);white-space:pre-line}
.starter{background:var(--pc-tint);border-left:12px solid var(--pc);padding:.5em .9em;margin:.5em 0;font-size:1.1em}
.wchips{display:flex;flex-wrap:wrap;gap:.4em;margin:.3em 0}

/* checklist */
.ck{display:flex;align-items:center;gap:.7em;width:100%;text-align:left;border:3px solid var(--black);background:#fff;min-height:2em;padding:.25em .8em;margin:.3em 0}
.ck .box{width:1.3em;height:1.3em;border:3px solid var(--black);flex:none;display:flex;align-items:center;justify-content:center;font-weight:700}
.ck{border-bottom:6px solid var(--pc)}
.ck.on{background:var(--pc-tint)}
.ck.on .box{background:var(--pc);color:var(--pc-ink)}
.ck{font-size:1.2em;min-height:2.4em}

/* email mock */
.mail{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff}
.mail .mh{background:var(--bar);color:#fff;padding:.3em .7em;font-weight:700}
.mail .mr{display:flex;border-bottom:2px solid var(--line)}
.mail .mr b{background:var(--pale);min-width:4em;padding:.3em .6em;flex:none}
.mail .mr span{padding:.3em .6em;min-width:0;overflow-wrap:anywhere}
.ml{display:block;width:100%;text-align:left;border:0;border-bottom:2px dashed var(--line);background:#fff;padding:.25em .8em;min-height:1.9em;white-space:pre-line}
.ml.bad{background:var(--or-tint)}
.ml.bad .orig{text-decoration:line-through;color:var(--mid)}
.ml .fix{font-weight:700}
.ml .arr{font-weight:700;color:var(--or-deep);margin:0 .3em}
.ml.okline{background:var(--pale2)}
.ml .okmsg{margin-left:.3em}
.status{border:3px solid var(--black);background:var(--pale2);padding:.35em .8em;margin:.5em 0;font-weight:700}
.status.win{background:var(--or);color:var(--black)}

/* browser tour */
.mock{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;user-select:none}
.mtabs{background:#2d2d2d;display:flex;align-items:flex-end;gap:.25em;padding:.35em .4em 0}
.mtool{background:#e3e3e3;display:flex;gap:.3em;align-items:center;padding:.35em .4em}
.mpage{display:flex;min-height:7em}
.mcontent{flex:1;padding:.5em;min-width:0}
.hot{border:3px solid transparent;background:transparent;min-height:2em;padding:.1em .5em;border-radius:6px;position:relative;color:var(--black)}
.mtabs .hot{background:#f2f2f2;border-color:#f2f2f2}
.mtabs .hot.tabc{border-radius:8px 0 0 0;padding-right:.3em}
.mtabs .hot.closex{border-radius:0 8px 0 0;margin-left:-.25em;padding:.1em .45em}
.mtabs .hot.plusb{background:transparent;border-color:transparent;color:#fff}
.mtool .hot.wide{background:#fff;border-color:#fff;border-radius:999px}
.mhead .hot.logo{font-family:var(--disp);font-weight:700;font-size:1.1em}
.mhead .hot.sbox{background:#fff;border:2px solid #9a9a9a;border-radius:999px;color:var(--mid)}
.hot.mmenu{background:#ececec;border-color:#ececec;border-radius:4px}
.hot.picked{border-color:var(--or)!important;box-shadow:0 0 0 3px var(--black)}
.hot.found{border-color:var(--black)!important;background:var(--or)!important;color:var(--black)!important}
.hot.flash{animation:flash .5s}
@keyframes flash{30%{background:#bdbdbd}}
.hot.wide{flex:1;text-align:left;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mhead{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;justify-content:space-between;margin-bottom:.4em}
.mmenu{display:block;width:100%;text-align:left;margin:.3em 0}
.gline{height:.5em;background:#d9d9d9;margin:.4em 0}
.gline.s{width:70%}.gline.t{width:45%}
.scrollb{width:1.8em;flex:none;border-left:2px solid #bbb;padding:.2em;display:flex}
.scrollb .hot{width:100%;padding:0;min-height:0;display:flex;align-items:flex-start;justify-content:center;background:#efefef;border-color:#efefef;border-radius:3px}
.scrollb .thumb{display:block;width:60%;height:2.5em;background:#8a8a8a;margin-top:.3em;border-radius:3px}
.hot.found .thumb{background:var(--black)}

/* web address */
.ytable{border-collapse:collapse;width:100%;max-width:30em;margin:0 auto;font-size:1.1em}
.ytable th,.ytable td{border:2px solid var(--line);padding:.25em .6em;text-align:left}
.ytable th{text-align:center;background:var(--pale)}
.sym{display:inline-block;border:2px solid var(--black);font-family:var(--mono);font-weight:700;padding:0 .4em;min-width:2em;text-align:center}
.segs{display:flex;flex-wrap:wrap;gap:.35em;margin:.6em 0;justify-content:center}
.seg{border:3px solid var(--black);background:#fff;min-height:2.6em;padding:.25em .55em;display:flex;flex-direction:column;align-items:center;justify-content:center}
.seg .w{font-family:var(--mono);font-weight:700;font-size:1.4em}
.seg .s{font-style:italic;color:var(--mid);min-height:1.1em}
.seg.on{border-bottom:8px solid var(--or);background:var(--or-tint)}
.seg.on .s{color:var(--black)}
.waddr{font-family:var(--mono);font-weight:700;font-size:1.6em;overflow-wrap:anywhere;text-align:center;margin:.4em 0}
.spoken{font-style:italic;font-size:1.25em;text-align:center;background:var(--or-tint);border-left:12px solid var(--or);padding:.5em .8em;margin:.6em 0}

/* overlays */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:1rem .6rem;overflow-y:auto;z-index:50}
.ovbox{background:#fff;border:3px solid var(--black);border-bottom:10px solid var(--or);width:100%;max-width:900px;padding:.8rem 1rem}
.ovhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem}
.ovhead h2{margin:0;font-family:var(--disp);font-size:1.15rem;flex:1}
.ovbox .bb{min-height:2.1rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(16rem,100%),1fr));gap:0 1rem}
.mlist{list-style:none;margin:.2rem 0 .8rem;padding:0}
.mlist button{display:block;width:100%;text-align:left;border:0;border-bottom:2px dashed var(--line);background:#fff;min-height:1.9rem;padding:.15rem .4rem}
.mlist button.cur{font-weight:700;background:var(--or-tint)}
.namebig{font-family:var(--disp);font-weight:700;font-size:2.4rem;text-align:center;border:3px solid var(--black);border-bottom:10px solid var(--or);padding:.8rem;margin:.6rem 0;min-height:4.4rem;overflow-wrap:anywhere}
.namebig.spin{color:var(--grey)}
.nin{font:inherit;border:3px solid var(--black);padding:.3rem .6rem;min-height:2.1rem;flex:1;min-width:8rem}
.nchip{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--black);border-radius:999px;padding:0 0 0 .6rem;margin:.2rem}
.nchip button{border:0;background:var(--black);color:#fff;border-radius:999px;min-width:1.8rem;min-height:1.8rem}

.wc.recd{background:var(--or);font-weight:700}
.recbox{border:3px solid var(--black);border-bottom:6px solid var(--or);padding:.5rem .7rem;margin:.5rem 0;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;align-items:center}
.waddrs{font-family:var(--mono)}
.burst{position:fixed;pointer-events:none;font-size:1.6rem;z-index:80;left:50%;top:45%;transition:transform 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s}


/* ===== Lesson 2 additions ===== */
/* browser history */
.hist{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff}
.hhead{background:var(--bar);color:#fff;display:flex;align-items:center;gap:.6em;padding:.35em .7em;flex-wrap:wrap}
.hhead b{font-family:var(--disp)}
.hsearch{flex:1;min-width:8em;background:var(--addr);border-radius:999px;padding:.1em .8em;font-size:.85em}
.hday{background:var(--pale);font-weight:700;padding:.2em .8em;border-bottom:2px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;width:100%;text-align:left;border:0;border-bottom:2px dashed var(--line);background:#fff;padding:.3em .8em;min-height:2em}
.hrow .hl2{background:var(--black);color:var(--or);font-family:var(--disp);font-weight:700;min-width:1.6em;text-align:center}
.hrow .ht{flex:1;min-width:0}
.hrow.on{background:var(--pc-tint)}
.hrow .ht{font-size:1.1em;font-weight:700}
.hrow .hq{flex-basis:100%;margin:.3em 0 .2em 2.1em;background:#fff;border:3px solid var(--black);border-left:12px solid var(--or);padding:.4em .8em;display:flex;flex-direction:column;gap:.15em}
.hrow .hqk{color:var(--mid);font-weight:700;font-size:.9em}
.hrow .hqt{font-weight:700;font-size:1.25em;line-height:1.25}

/* bridge: lesson 1 to lesson 2 */
.bridge{display:flex;flex-direction:column;gap:.4em}
.brow{display:grid;grid-template-columns:1fr 2.2em 1fr;align-items:stretch;width:100%;text-align:left;border:0;background:transparent;padding:0}
.bcell{border:3px solid var(--black);background:#fff;padding:.3em .7em;display:flex;align-items:center;min-height:2.2em}
.bcell.l1{background:var(--pale2)}
.bcell.l2{border-bottom:7px solid var(--pc);background:var(--pc-tint);font-weight:700}
.bcell.l2.hid{background:repeating-linear-gradient(45deg,#f1f1f1 0 10px,#e2e2e2 10px 20px);color:var(--mid);font-weight:400;border-bottom-color:var(--line)}
.barr{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3em}
.bhead{display:grid;grid-template-columns:1fr 2.2em 1fr;font-family:var(--disp);font-weight:700}
.bhead span{padding:0 .2em}

/* too fast game */
.fastbox{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;padding:.8em 1em;text-align:center}
.fastaddr{font-family:var(--mono);font-weight:700;font-size:1.6em;min-height:1.6em;overflow-wrap:anywhere;margin:.3em 0}
.fastaddr.blur{filter:blur(.28em);color:var(--grey)}
.fastaddr.zoom{animation:zoomby .9s ease-in}
@keyframes zoomby{0%{transform:translateX(-60%);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateX(60%);opacity:0}}
.slowsegs{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;margin:.4em 0}
.slowsegs .seg{min-height:2.2em}
.slowsegs .seg.pop{animation:popin .35s ease-out}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.say1{display:inline-block;background:var(--pc-tint);border:3px solid var(--black);border-left:12px solid var(--pc);padding:.3em .8em;font-weight:700;font-size:1.15em;margin:.3em 0}

/* up or down */
.ud{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;border:3px solid var(--black);border-bottom:6px solid var(--pc);background:#fff;padding:.3em .7em;margin:.35em 0}
.ud .q{flex:1;min-width:8em;font-size:1.2em;font-weight:700}
.ud .q .arw{display:inline-block;margin-left:.3em;color:var(--or-deep);font-size:1.2em}
.ud .ub{border:3px solid var(--black);background:#fff;min-width:2.6em;min-height:2.1em;font-size:1.25em;font-weight:700;border-radius:3px}
.ud .ub.right{background:var(--black);color:var(--or)}
.ud .ub.wrong{background:repeating-linear-gradient(45deg,#e8e8e8 0 8px,#cdcdcd 8px 16px);text-decoration:line-through}
.ud.done{background:var(--pc-tint)}

/* listening player */
.player{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff;user-select:none}
.player .ptop{background:var(--bar);color:#fff;padding:.35em .7em;font-weight:700;display:flex;gap:.5em;align-items:center;flex-wrap:wrap}
.player .ptop .tag{font-size:.75em}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;padding:.6em .6em .3em}
.prow2{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;padding:.2em .6em .7em}
.player .hot{border:3px solid var(--black);background:#f2f2f2;min-height:2.2em;min-width:2.4em;font-weight:700;border-radius:6px}
.player .hot.pbar{flex:1;min-width:6em;padding:.2em .4em;display:flex;align-items:center;background:#fff}
.ptrack{display:block;width:100%;height:.7em;background:#d9d9d9;position:relative;border-radius:999px;overflow:hidden}
.ptrack i{position:absolute;left:0;top:0;bottom:0;background:var(--black);border-radius:999px}
.player .hot.ptime{font-family:var(--mono);background:#fff}
.player .hot.ptext{background:#fff}
.player .hot.picked{border-color:var(--or)!important;box-shadow:0 0 0 3px var(--black);background:var(--or-tint)}
.player .hot.found{background:var(--or)!important}
.player .hot.found .ptrack i{background:var(--black)}
.lines{padding:0 .8em .6em}
.eq{display:flex;gap:.18em;align-items:flex-end;height:1.2em}
.eq i{display:block;width:.25em;background:var(--or);height:30%}
.eq.on i{animation:eq .7s ease-in-out infinite alternate}
.eq.on i:nth-child(2){animation-delay:.15s}.eq.on i:nth-child(3){animation-delay:.3s}.eq.on i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%{height:20%}100%{height:100%}}

/* safe or not safe */
.sf{border:3px solid var(--black);border-bottom:6px solid var(--pc);background:#fff;padding:.35em .7em;margin:.35em 0}
.sf .st{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.sf .st .tx{flex:1;min-width:10em;font-weight:700;font-size:1.1em}
.sf .sb{border:3px solid var(--black);background:#fff;min-height:2.1em;padding:0 .7em;font-weight:700;border-radius:3px}
.sf .sb.right{background:var(--black);color:#fff}
.sf .sb.wrong{background:repeating-linear-gradient(45deg,#e8e8e8 0 8px,#cdcdcd 8px 16px);text-decoration:line-through}
.sf .why{margin-top:.25em;color:var(--black)}
.sf.done{background:var(--pc-tint)}

.udgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(17em,100%),1fr));gap:0 .6em}
@media (max-width:640px){
  .brow,.bhead{grid-template-columns:1fr}
  .barr{transform:rotate(90deg);min-height:1.4em}
  .bhead span:nth-child(2),.bhead span:nth-child(3){display:none}
}

/* ===== Lesson 3 additions ===== */
/* politeness ladder */
.ladder{display:flex;flex-direction:column-reverse;gap:.4em;margin:.4em 0}
.rung{display:flex;align-items:center;gap:.7em;border:3px solid var(--black);background:#fff;padding:.4em .8em;min-height:2.4em;font-size:1.15em}
.rung .lv{font-family:var(--disp);font-weight:700;min-width:7.5em;font-size:.8em;color:var(--mid)}
.rung .em{font-size:1.4em}
.rung .tx{flex:1;font-weight:700}
.rung.off{background:repeating-linear-gradient(45deg,#f1f1f1 0 10px,#e2e2e2 10px 20px);color:var(--mid)}
.rung.off .tx{font-weight:400}
.rung.top{border-bottom:8px solid var(--pc);background:var(--pc-tint)}
.rung.pop{animation:popin .35s ease-out}
@keyframes popin{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* inbox */
.inbox{border:3px solid var(--black);border-bottom:10px solid var(--pc);background:#fff}
.ibhead{background:var(--bar);color:#fff;padding:.35em .7em;font-weight:700;display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.ibrow{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;width:100%;text-align:left;border:0;border-bottom:2px dashed var(--line);background:#fff;padding:.35em .8em;min-height:2.3em}
.ibrow .dot{width:.6em;height:.6em;border-radius:50%;background:var(--or);flex:none}
.ibrow .from{min-width:6.5em;font-weight:700;color:var(--mid)}
.ibrow .subj{flex:1;min-width:0;font-weight:700}
.ibrow .subj.empty{color:var(--grey);font-style:italic;font-weight:400}
.ibrow .res{flex-basis:100%;padding-left:1.2em}
.ibrow.good{background:var(--pc-tint)}
.ibrow.bad{background:repeating-linear-gradient(45deg,#f4f4f4 0 10px,#e6e6e6 10px 20px)}
.ibrow.read .dot{background:transparent;border:2px solid var(--line)}

/* email shape stack */
.stack{display:flex;flex-direction:column;gap:.25em}
.stg{display:flex;align-items:center;gap:.6em;border:3px solid var(--black);background:#fff;padding:.2em .7em;min-height:1.9em}
.stg .n{background:var(--black);color:var(--or);font-family:var(--disp);font-weight:700;min-width:1.6em;text-align:center}
.stg .em{font-size:1.2em}
.stg .nm{font-weight:700;min-width:9em}
.stg .ex{color:var(--mid);font-style:italic;flex:1;min-width:0}
.stg.hid{visibility:hidden}
.stg.new{animation:popin .35s ease-out}
.stg.req{border-bottom:6px solid var(--pc);background:var(--pc-tint)}

/* three-choice cards */
.sf .sb.three{min-width:6em}
.ccgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(19em,100%),1fr));gap:0 .6em}
.ccgrid .sf{margin:.3em 0}
.codeline{font-family:var(--mono);font-weight:700;font-size:1.05em;background:var(--pale2);border:2px solid var(--line);padding:.1em .5em}
.wq{display:flex;gap:.6em;align-items:center;flex-wrap:wrap;font-size:1.05em}
.wq .tx{flex:1;min-width:10em;font-weight:700}
.three3{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.3em}
.sf .sb{min-height:2.1em}
.reason{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(12em,100%),1fr));gap:.5em;margin:.5em 0}
.rq{border:3px solid var(--black);border-bottom:8px solid var(--pc);background:#fff;padding:.5em .7em;text-align:center;min-height:5em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em}
.rq .em{font-size:2em;line-height:1}
.rq b{font-size:1.1em}
.rq.hid b{visibility:hidden}

@media (max-width:900px){ .ppill{display:none} }
@media (max-width:560px){
  .foot .tip{display:none}
  .dots,.top .tag,.lbl{display:none}
  .foot .btns{width:100%}
  .foot .btns .bb{flex:1;padding:0 .4rem}
  #bPick{flex:0 0 auto}
  .board{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

<script>
(function(){
"use strict";
var KEY = "vu23521_lesson3_intro_v1";
var SIZES = [24, 28, 34, 42];
var SIZE_NAMES = ["Normal", "Large", "Larger", "Largest"];
var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var TIMERS = [];
var storeOK = false;

var S = blankState();
function blankState(){
  return {i:0, size:1, names:[], picked:[], tiles:{}, ord:{}, polls:{}, last:{},
    hist:{}, bridge:{}, tab:0, q3:{}, texts:{}, tone:{}, fix:{}, lad:{n:0, lv:0}, inbox:{}, stack:0, lesson:{}, card:null};
}
function load(){
  try{
    localStorage.setItem("__t","1"); localStorage.removeItem("__t"); storeOK = true;
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); for(var k in o){ if(o.hasOwnProperty(k)) S[k] = o[k]; } }
  }catch(e){ storeOK = false; }
  S.card = null;
  if(typeof S.i !== "number" || S.i < 0) S.i = 0;
}
function save(){ if(!storeOK) return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function h(t, a, c){
  var e = document.createElement(t), k;
  if(a){ for(k in a){ if(!a.hasOwnProperty(k)) continue;
    if(k === "cls") e.className = a[k];
    else if(k.indexOf("on") === 0) e.addEventListener(k.slice(2), a[k]);
    else e.setAttribute(k, a[k]); } }
  if(c != null){ if(!(c instanceof Array)) c = [c];
    for(var i = 0; i < c.length; i++){ var x = c[i]; if(x == null || x === false) continue;
      e.appendChild(typeof x === "string" || typeof x === "number" ? document.createTextNode(String(x)) : x); } }
  return e;
}
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function later(fn, ms){ TIMERS.push(setTimeout(fn, ms)); }
function clearTimers(){ for(var i = 0; i < TIMERS.length; i++) clearTimeout(TIMERS[i]); TIMERS = []; }
function sbar(n, t){ return h("div", {cls:"sbar"}, [h("div", {cls:"blk"}, n), h("div", {cls:"ttl"}, t)]); }
function note(kind, sym, kids){ return h("div", {cls:"note " + (kind || "")}, [h("div", {cls:"badge"}, sym), h("div", {cls:"nb"}, kids)]); }
function act(n, t){ return h("div", {cls:"act"}, [h("div", {cls:"num"}, n), h("div", {cls:"ins"}, t)]); }

/* speech */
var VOICE = null;
function pickVoice(){
  if(!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices(), pref = ["en-AU", "en-GB", "en-NZ", "en-US", "en"];
  for(var p = 0; p < pref.length; p++){ for(var i = 0; i < vs.length; i++){ if(vs[i].lang && vs[i].lang.replace("_","-").indexOf(pref[p]) === 0){ VOICE = vs[i]; return; } } }
}
if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text); if(VOICE) u.voice = VOICE; u.lang = VOICE ? VOICE.lang : "en-AU"; u.rate = 0.85; speechSynthesis.speak(u); }catch(e){}
}
function sayBtn(text, label){
  if(!window.speechSynthesis) return null;
  return h("button", {cls:"wc", "aria-label":"Hear it: " + text, onclick:function(ev){ ev.stopPropagation(); say(text); }}, "\uD83D\uDD0A " + (label || "Hear it"));
}

function burst(list){
  if(REDUCED) return;
  list = list || ["\uD83C\uDF89", "\u2B50", "\uD83D\uDC4F", "\u2705", "\uD83D\uDD36"];
  for(var i = 0; i < 18; i++){
    (function(i){
      var s = h("span", {cls:"burst"}, list[i % list.length]);
      document.body.appendChild(s);
      var ang = Math.random() * Math.PI * 2, d = 140 + Math.random() * 220;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        s.style.transform = "translate(" + Math.round(Math.cos(ang) * d) + "px," + Math.round(Math.sin(ang) * d - 60) + "px) rotate(" + Math.round(Math.random() * 360) + "deg)";
        s.style.opacity = "0";
      }); });
      setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); }, 1300);
    })(i);
  }
}

function pollGrid(id, opts){
  var counts = S.polls[id] || (S.polls[id] = []);
  var max = 0, i; for(i = 0; i < opts.length; i++){ if((counts[i] || 0) > max) max = counts[i]; }
  var grid = h("div", {cls:"poll"});
  for(i = 0; i < opts.length; i++){
    (function(i){
      var c = counts[i] || 0;
      grid.appendChild(h("button", {cls:"pt", "aria-label":opts[i][1] + ". " + c + " taps", onclick:function(){
        counts[i] = (counts[i] || 0) + 1; S.last[id] = i; save(); keep(); }},
        [h("span", {cls:"em", "aria-hidden":"true"}, opts[i][0]), h("span", null, opts[i][1]),
         c ? h("span", {cls:"cnt"}, String(c)) : null,
         h("span", {cls:"meter"}, h("i", {style:"width:" + (max ? Math.round(c / max * 100) : 0) + "%"}))]));
    })(i);
  }
  var total = 0; for(i = 0; i < counts.length; i++) total += counts[i] || 0;
  var tools = h("div", {cls:"row ptools small"}, [
    h("span", {cls:"muted"}, "Taps so far: " + total),
    h("button", {cls:"wc", onclick:function(){ var l = S.last[id]; if(l != null && counts[l] > 0){ counts[l]--; S.last[id] = null; save(); keep(); } }}, "\u21A9 Undo the last tap"),
    h("button", {cls:"wc", onclick:function(){ S.polls[id] = []; S.last[id] = null; save(); keep(); }}, "Clear")
  ]);
  return h("div", null, [grid, tools]);
}

/* ------------- Q&A tiles: Lesson 2 replay ------------- */
var TILES = [
  {k:"quiz", from:"Ask for a replay", q:"The tutor speaks very fast. You miss the web address. What do you say?",
   opts:["Sorry, I didn't quite catch that. Could you slow down a bit?", "Speak slowly now!", "What? Again!"],
   why:"Say what you missed. Then ask politely: Could you ...?",
   talk:"Your partner says a phone number fast. Ask for a replay."},
  {k:"quiz", from:"Past simple", q:"Yesterday I ___ a listening about the beach.",
   opts:["chose", "choosed", "choose"],
   why:"choose is irregular. choose → chose. Yesterday is finished, so use the past simple.",
   talk:"Tell your partner: What did you do yesterday? Use two verbs."},
  {k:"talk", from:"Learn English online", q:"Did you try an English website or app this week?",
   starter:"Yes, I tried ... / No, I didn't try one. I ...", ask:"Was it free? Who is it for?",
   words:["a podcast", "a news website", "a grammar quiz", "it's worth a try", "good to know"]},
  {k:"quiz", from:"Phrasal verbs", q:"You are on a library computer. At the end, you ___ of the website.",
   opts:["log out", "log in", "sign up"],
   why:"log out of the website = finish with your password. Then close the browser.",
   talk:"What does sign up mean? Tell your partner."},
  {k:"quiz", from:"Stay safe", q:"A pop-up says you won a prize. It asks for your card number. What do you do?",
   opts:["Close it with the x.", "Type your card number.", "Send it to your friends."],
   why:"It is not real. Never type your card number or password in a pop-up.",
   talk:"Tell your partner one more way to stay safe online."},
  {k:"talk", from:"Print it, save it", q:"You have no printer at home. How can you keep your answers?",
   starter:"I can take a screenshot and ...", ask:"How do you take a screenshot on your phone?",
   words:["take a screenshot", "save it", "print it out", "email it to my teacher"]},
  {k:"quiz", from:"Joining words", q:"The sound was very quiet, ___ I turned up the volume.",
   opts:["so", "but", "or"],
   why:"so shows the result. The sound was quiet. The result: I turned it up.",
   talk:"Finish it: The video was too fast, so I ..."},
  {k:"quiz", from:"Yuko's email", q:"Yuko had two problems. Which word did Yuko write before the second problem?",
   opts:["Secondly,", "Hey,", "Cheers,"],
   why:"Firstly, ... Secondly, ... The reader can see two problems.",
   talk:"What is the next word after Firstly and Secondly? Tell your partner."}
];
function tileDone(n){ return S.tiles[n] && S.tiles[n].done; }
function openCount(){ var c = 0; for(var i = 0; i < TILES.length; i++) if(tileDone(i)) c++; return c; }

function renderBoard(w){
  w.appendChild(sbar("2", "Lesson 2 replay"));
  w.appendChild(h("div", {cls:"legend"}, [
    h("span", null, [h("i", {cls:"sw q"}), "❓ Quiz"]),
    h("span", null, [h("i", {cls:"sw"}), "💬 Talk"]),
    h("span", null, [h("i", {cls:"sw d"}), "Done: " + openCount() + " of " + TILES.length])]));
  var b = h("div", {cls:"board", style:"grid-template-columns:repeat(4,minmax(0,1fr))"});
  for(var i = 0; i < TILES.length; i++){
    (function(i){
      var t = TILES[i], d = tileDone(i);
      b.appendChild(h("button", {cls:"tile " + (t.k === "quiz" ? "quiz" : "talk") + (d ? " done" : ""), style:"aspect-ratio:2/1",
        "aria-label":"Tile " + (i + 1) + ", " + t.k + (d ? ", done" : ""), onclick:function(){ S.card = i; render(); }},
        [String(i + 1), h("span", {cls:"ic"}, t.k === "quiz" ? "❓" : "💬")]));
    })(i);
  }
  w.appendChild(b);
  w.appendChild(h("div", {cls:"row", style:"margin-top:.7em"}, [
    h("button", {cls:"bb go", onclick:function(){
      var left = []; for(var i = 0; i < TILES.length; i++) if(!tileDone(i)) left.push(i);
      if(!left.length){ burst(); return; }
      S.card = left[Math.floor(Math.random() * left.length)]; render(); }}, "🎲 Pick a tile for me"),
    openCount() ? h("button", {cls:"bb", onclick:function(){ if(confirmTwice(this, "Tap again to close every tile")){ S.tiles = {}; for(var k = 0; k < TILES.length; k++) delete S.ord[k]; save(); keep(); } }}, "Close every tile") : null,
    openCount() === TILES.length ? h("span", {cls:"hl"}, "🎉 Lesson 2 replay done!") : null
  ]));
}

function renderCard(w){
  var n = S.card, t = TILES[n], st = S.tiles[n] || (S.tiles[n] = {});
  var card = h("div", {cls:"card"}, [h("div", {cls:"qhead"}, [
    h("div", {cls:"ntile" + (t.k === "talk" ? " talk" : "")}, String(n + 1)),
    h("span", {cls:"kick"}, (t.k === "quiz" ? "❓ Quiz" : "💬 Talk") + ": " + t.from)]),
    h("div", {cls:"qtext"}, t.q)]);
  if(t.show) card.appendChild(h("div", {cls:"show"}, t.show));
  if(t.k === "quiz"){
    var ord = S.ord[n]; if(!ord){ ord = S.ord[n] = shuffle([0, 1, 2]); save(); }
    var answered = st.pick != null;
    for(var j = 0; j < ord.length; j++){
      (function(idx){
        var cls = "opt", mk = "";
        if(answered){
          if(idx === 0){ cls += " right"; mk = "✓"; }
          else if(idx === st.pick){ cls += " wrong"; mk = "✗"; }
          else return;
        }
        card.appendChild(h("button", {cls:cls, onclick:function(){
          if(st.pick != null) return;
          st.pick = idx; st.done = true; save(); keep();
          if(idx === 0) burst(["✅", "⭐", "🎉"]);
        }}, [h("span", {cls:"tx"}, t.opts[idx]), mk ? h("span", {cls:"mk"}, mk) : null]));
      })(ord[j]);
    }
    if(answered){
      var lead = st.pick === 0 ? "Yes! That's right. " : (st.pick === -1 ? "Here is the answer. " : "Not this time. ");
      card.appendChild(note("", "i", [h("p", null, [h("b", null, lead), t.why]), h("p", null, [h("b", null, "Now talk: "), t.talk])]));
    }
    card.appendChild(h("div", {cls:"row"}, answered ?
      h("button", {cls:"bb", onclick:function(){ st.pick = null; st.done = false; S.ord[n] = shuffle([0, 1, 2]); save(); keep(); }}, "↻ Ask another pair") :
      h("button", {cls:"bb", onclick:function(){ st.pick = -1; st.done = true; save(); keep(); }}, "Show the answer")));
  } else {
    card.appendChild(h("div", {cls:"starter"}, [h("b", null, "Start like this: "), t.starter]));
    var wc = h("div", {cls:"wchips"});
    for(var k = 0; k < t.words.length; k++){ wc.appendChild(sayBtn(t.words[k], t.words[k]) || h("span", {cls:"wc"}, t.words[k])); }

function confirmTwice(btn, msg){
  if(btn.getAttribute("data-armed") === "1") return true;
  btn.setAttribute("data-armed", "1"); var old = btn.textContent; btn.textContent = msg;
  setTimeout(function(){ if(btn.parentNode){ btn.removeAttribute("data-armed"); btn.textContent = old; } }, 3000);
  return false;
}

/* ------------- fit: one item fills the screen, no scrolling ------------- */
var main = document.getElementById("main"), wrap = document.getElementById("wrap");
var slideEl = null;
function fit(){
  if(!slideEl) return;
  var cs = getComputedStyle(main);
  var avail = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
  var s = 1;
  var base = SIZES[S.size];
  function set(v){ slideEl.style.fontSize = (base * v).toFixed(1) + "px"; }
  set(1);
  if(slideEl.offsetHeight <= avail){
    while(s < 1.6){ set(s + 0.05); if(slideEl.offsetHeight > avail) break; s += 0.05; }
    set(s);
  } else {
    while(slideEl.offsetHeight > avail && base * s > 18){ s -= 0.03; set(s); }
  }
}
var fitTimer = null;
window.addEventListener("resize", function(){ clearTimeout(fitTimer); fitTimer = setTimeout(fit, 80); });
document.addEventListener("fullscreenchange", function(){ setTimeout(fit, 120); });

/* ------------- router ------------- */
function render(){
  clearTimers();
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
    if(S.i >= SLIDES.length) S.i = SLIDES.length - 1;
  var sl = SLIDES[S.i], part = PARTS[sl.p - 1];
  document.getElementById("addr").textContent = "\uD83D\uDD12 vu23521 \u203A " + part.slug + " \u203A " + sl.slug + (sl.board && S.card != null ? " \u203A tile-" + (S.card + 1) : "");
  document.body.className = "p" + sl.p;
  document.getElementById("ppill").textContent = "Part " + part.n + ": " + part.t;
  var pg = document.getElementById("prog"); pg.innerHTML = "";
  for(var q = 0; q < SLIDES.length; q++) pg.appendChild(h("i", {cls:q < S.i ? "past" : (q === S.i ? "cur" : ""), style:"background:" + PCOL[SLIDES[q].p - 1]}));
  wrap.innerHTML = "";
  slideEl = h("div", {cls:"slide"});
  wrap.appendChild(slideEl);
  sl.r(slideEl);
  document.getElementById("tip").textContent = (S.i + 1) + " / " + SLIDES.length + "  \u00B7  " + sl.tip;
  var back = document.getElementById("bBack"), next = document.getElementById("bNext");
  back.disabled = S.i === 0 && !(sl.board && S.card != null);
  if(sl.board && S.card != null) next.innerHTML = "Back to the board";
  else next.innerHTML = S.i === SLIDES.length - 1 ? "Finish \uD83C\uDF89" : "Next \u25B6";
  main.scrollTop = 0;
  fit();
}
var keeping = false;
function keep(){ keeping = true; render(); keeping = false; }
function go(i){ if(i < 0 || i >= SLIDES.length) return; S.i = i; S.card = null; save(); render(); }
function next(){
  var sl = SLIDES[S.i];
  if(sl.board && S.card != null){ S.card = null; render(); return; }
  if(S.i === SLIDES.length - 1){ burst(); return; }
  go(S.i + 1);
}
function back(){
  var sl = SLIDES[S.i];
  if(sl.board && S.card != null){ S.card = null; render(); return; }
  go(S.i - 1);
}
document.getElementById("bNext").onclick = next;
document.getElementById("bBack").onclick = back;
document.getElementById("bSmall").onclick = function(){ if(S.size > 0){ S.size--; save(); render(); } };
document.getElementById("bBig").onclick = function(){ if(S.size < SIZES.length - 1){ S.size++; save(); render(); } };
document.getElementById("bFull").onclick = function(){
  try{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen(); } else { document.exitFullscreen(); } }catch(e){}
};
document.getElementById("bMenu").onclick = openMenu;
document.getElementById("bPick").onclick = function(){ openPicker(false); };

/* ------------- overlays ------------- */
var ovRoot = document.getElementById("ovRoot");
function closeOv(){ ovRoot.innerHTML = ""; ovRoot.removeAttribute("data-rec"); }
function overlay(title, body){
  closeOv();
  var box = h("div", {cls:"ovbox", role:"dialog", "aria-modal":"true", "aria-label":title}, [
    h("div", {cls:"ovhead"}, [h("h2", null, title), h("button", {cls:"bb", "aria-label":"Close", onclick:closeOv}, "\u2715 Close")]), body]);
  var ov = h("div", {cls:"ov", onclick:function(e){ if(e.target === ov) closeOv(); }}, box);
  ovRoot.appendChild(ov);
}
function openMenu(){
  var body = h("div"), grid = h("div", {cls:"mgrid"});
  for(var p = 0; p < PARTS.length; p++){
    var col = h("div");
    col.appendChild(h("div", {cls:"chip", style:"margin-top:.5rem;font-size:1rem;border-bottom:6px solid " + PCOL[p]}, [h("span", {cls:"l", style:"background:" + PCOL[p] + ";color:" + PINK[p]}, String(PARTS[p].n)), h("span", {cls:"t"}, h("b", null, PARTS[p].t))]));
    var ul = h("ul", {cls:"mlist"});
    for(var i = 0; i < SLIDES.length; i++){
      if(SLIDES[i].p !== PARTS[p].n) continue;
      (function(i){ ul.appendChild(h("li", null, h("button", {cls:i === S.i ? "cur" : "", onclick:function(){ closeOv(); go(i); }}, (i + 1) + ". " + SLIDES[i].name))); })(i);
    }
    col.appendChild(ul); grid.appendChild(col);
  }
  body.appendChild(grid);
  body.appendChild(h("div", {cls:"row"}, [
    h("span", {cls:"muted"}, "Text size: " + SIZE_NAMES[S.size]),
    h("button", {cls:"bb", onclick:function(){ openPicker(true); }}, "\uD83D\uDC65 Class list"),
    h("button", {cls:"bb", onclick:function(){ if(confirmTwice(this, "Tap again to start again")){ var names = S.names, size = S.size; S = blankState(); S.names = names; S.size = size; save(); closeOv(); render(); } }}, "Start again from the beginning")]));
  if(!storeOK) body.appendChild(note("warn", "!", h("p", null, "This page cannot save on this device. It still works.")));
  overlay("Menu", body);
}
function openPicker(edit){
  var body = h("div"), i;
  if(!S.names.length || edit === true){
    body.appendChild(h("p", null, "Type a name. Tap Add. The names stay on this device only."));
    var inp = h("input", {cls:"nin", type:"text", maxlength:"30", "aria-label":"A student name", autocomplete:"off"});
    var add = function(){ var v = inp.value.replace(/\s+/g, " ").trim(); if(!v) return;
      for(var i = 0; i < S.names.length; i++) if(S.names[i].toLowerCase() === v.toLowerCase()){ inp.value = ""; return; }
      S.names.push(v); save(); openPicker(true); var ni = ovRoot.querySelector(".nin"); if(ni) ni.focus(); };
    inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); add(); } });
    body.appendChild(h("div", {cls:"row"}, [inp, h("button", {cls:"bb go", onclick:add}, "Add")]));
    var list = h("div", {style:"margin:.6rem 0"});
    for(i = 0; i < S.names.length; i++){
      (function(i){ list.appendChild(h("span", {cls:"nchip"}, [S.names[i], h("button", {"aria-label":"Remove " + S.names[i], onclick:function(){
        var nm = S.names[i]; S.names.splice(i, 1); var pi = S.picked.indexOf(nm); if(pi > -1) S.picked.splice(pi, 1); save(); openPicker(true); }}, "\u2715")])); })(i);
    }
    if(!S.names.length) list.appendChild(h("p", {cls:"muted"}, "No names yet."));
    body.appendChild(list);
    if(S.names.length) body.appendChild(h("button", {cls:"bb solid", onclick:function(){ openPicker(false); }}, "Done \u2713"));
    overlay("Class list", body);
    setTimeout(function(){ var ni = ovRoot.querySelector(".nin"); if(ni && !("ontouchstart" in window)) ni.focus(); }, 30);
    return;
  }
  var big = h("div", {cls:"namebig", "aria-live":"polite"}, "\uD83C\uDFB2");
  var left = 0; for(i = 0; i < S.names.length; i++) if(S.picked.indexOf(S.names[i]) < 0) left++;
  body.appendChild(big);
  body.appendChild(h("p", {cls:"muted center"}, left + " of " + S.names.length + " names left this round"));
  var spinning = false;
  body.appendChild(h("div", {cls:"row", style:"justify-content:center"}, [
    h("button", {cls:"bb go", onclick:function(){
      if(spinning) return;
      var pool = []; for(var k = 0; k < S.names.length; k++) if(S.picked.indexOf(S.names[k]) < 0) pool.push(S.names[k]);
      if(!pool.length){ S.picked = []; pool = S.names.slice(); }
      var pick = pool[Math.floor(Math.random() * pool.length)];
      var land = function(){ big.classList.remove("spin"); big.textContent = pick + " \uD83D\uDC4B"; S.picked.push(pick); save(); spinning = false; };
      if(REDUCED){ land(); return; }
      spinning = true; big.classList.add("spin"); var n = 0;
      (function roll(){ big.textContent = S.names[Math.floor(Math.random() * S.names.length)]; if(n++ < 14) setTimeout(roll, 60 + n * 9); else land(); })();
    }}, "\uD83C\uDFB2 Pick a name"),
    h("button", {cls:"bb", onclick:function(){ openPicker(true); }}, "Edit names"),
    h("button", {cls:"bb", onclick:function(){ S.picked = []; save(); openPicker(false); }}, "New round")]));
  overlay("Who's next?", body);
}

document.addEventListener("keydown", function(e){
  if(e.target && e.target.tagName === "INPUT"){ if(e.key === "Escape") closeOv(); return; }
  if(e.key === "Escape"){ if(ovRoot.innerHTML) closeOv(); else if(SLIDES[S.i].board && S.card != null) next(); else openMenu(); return; }
  if(ovRoot.innerHTML) return;
  if(e.key === "ArrowRight" || e.key === "PageDown"){ e.preventDefault(); next(); }
  else if(e.key === "ArrowLeft" || e.key === "PageUp"){ e.preventDefault(); back(); }
});
window.addEventListener("pagehide", save);

load();
render();
})();
